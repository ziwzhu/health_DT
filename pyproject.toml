[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "health-dt"
version = "2.0.0"
description = "Digital twin pipeline for cancer survivorship care utilisation from SEER-Medicare claims"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
include = ["health_dt*"]
